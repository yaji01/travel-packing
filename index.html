<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行持ち物メモ</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 20px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .option:last-child {
      border-bottom: none;
    }

    .packing-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .packing-item:last-child {
      border-bottom: none;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
    }

    .hidden {
      display: none;
    }

    .back {
      border: none;
      background: none;
      color: #007aff;
      font-size: 17px;
      padding: 0;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ホーム -->
    <div id="home">
      <h1>旅行持ち物メモ</h1>

      <div class="subtitle">
        旅行パターンを組み合わせて、持ち物リストを作ります
      </div>

      <div class="card">
        <h2>次の旅行</h2>
        <p>まだ旅行は登録されていません。</p>
      </div>

      <button class="button" onclick="showCreateTrip()">
        ＋ 新しい旅行を作る
      </button>
    </div>

    <!-- 旅行パターン選択 -->
    <div id="createTrip" class="hidden">

      <button class="back" onclick="showHome()">
        ← 戻る
      </button>

      <h1>新しい旅行</h1>

      <div class="subtitle">
        当てはまる旅行パターンを選んでください
      </div>

      <div class="card">

        <label class="option">
          <input type="checkbox" value="basic" class="trip-type">
          基本
        </label>

        <label class="option">
          <input type="checkbox" value="domestic" class="trip-type">
          国内旅行
        </label>

        <label class="option">
          <input type="checkbox" value="overseas" class="trip-type">
          海外旅行
        </label>

        <label class="option">
          <input type="checkbox" value="children" class="trip-type">
          子連れ
        </label>

        <label class="option">
          <input type="checkbox" value="summer" class="trip-type">
          夏
        </label>

        <label class="option">
          <input type="checkbox" value="winter" class="trip-type">
          冬
        </label>

        <label class="option">
          <input type="checkbox" value="onsen" class="trip-type">
          温泉
        </label>

        <label class="option">
          <input type="checkbox" value="pool" class="trip-type">
          海・プール
        </label>

      </div>

      <button class="button" onclick="createPackingList()">
        チェックリストを作る
      </button>

    </div>

    <!-- 持ち物リスト -->
    <div id="packingList" class="hidden">

      <button class="back" onclick="showCreateTrip()">
        ← パターン選択に戻る
      </button>

      <h1>持ち物リスト</h1>

      <div class="subtitle">
        準備できたものにチェックを入れてください
      </div>

      <div id="packingItems"></div>

    </div>

  </div>

  <script>

    const templates = {

      basic: {
        "基本": [
          "財布",
          "iPhone",
          "充電ケーブル",
          "モバイルバッテリー",
          "下着",
          "靴下",
          "歯ブラシ",
          "常備薬"
        ]
      },

      domestic: {
        "国内旅行": [
          "健康保険証",
          "交通系ICカード"
        ]
      },

      overseas: {
        "海外旅行": [
          "パスポート",
          "クレジットカード",
          "海外旅行保険",
          "eSIM",
          "変換プラグ"
        ]
      },

      children: {
        "子ども": [
          "子どもの着替え",
          "子どもの保険証",
          "お菓子",
          "おもちゃ",
          "ウェットティッシュ"
        ]
      },

      summer: {
        "夏": [
          "帽子",
          "日焼け止め",
          "サングラス"
        ]
      },

      winter: {
        "冬": [
          "防寒着",
          "手袋",
          "マフラー"
        ]
      },

      onsen: {
        "温泉": [
          "スキンケア用品",
          "替えの下着"
        ]
      },

      pool: {
        "海・プール": [
          "水着",
          "ゴーグル",
          "タオル",
          "防水バッグ"
        ]
      }

    };


    function showCreateTrip() {
      document.getElementById("home").classList.add("hidden");
      document.getElementById("packingList").classList.add("hidden");
      document.getElementById("createTrip").classList.remove("hidden");
    }


    function showHome() {
      document.getElementById("createTrip").classList.add("hidden");
      document.getElementById("packingList").classList.add("hidden");
      document.getElementById("home").classList.remove("hidden");
    }


    function createPackingList() {

      const selected =
        document.querySelectorAll(".trip-type:checked");

      if (selected.length === 0) {
        alert("旅行パターンを1つ以上選んでください");
        return;
      }

      const packingItems =
        document.getElementById("packingItems");

      packingItems.innerHTML = "";

      const addedItems = new Set();

      selected.forEach(option => {

        const template = templates[option.value];

        for (const category in template) {

          const items = template[category];

          const uniqueItems =
            items.filter(item => !addedItems.has(item));

          if (uniqueItems.length === 0) return;

          const card = document.createElement("div");
          card.className = "card";

          const title = document.createElement("h2");
          title.textContent = category;

          card.appendChild(title);

          uniqueItems.forEach(item => {

            addedItems.add(item);

            const label =
              document.createElement("label");

            label.className = "packing-item";

            const checkbox =
              document.createElement("input");

            checkbox.type = "checkbox";

            const text =
              document.createElement("span");

            text.textContent = item;

            label.appendChild(checkbox);
            label.appendChild(text);

            card.appendChild(label);

          });

          packingItems.appendChild(card);

        }

      });

      document
        .getElementById("createTrip")
        .classList.add("hidden");

      document
        .getElementById("packingList")
        .classList.remove("hidden");

    }

  </script>

</body>
</html>
