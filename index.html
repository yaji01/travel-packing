<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>旅行持ち物メモ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }

    h3 {
      font-size: 17px;
      margin: 0;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      font-size: 17px;
      border: 1px solid #d8d8dd;
      border-radius: 10px;
      background: white;
      color: #222;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    .button.secondary {
      background: white;
      color: #007aff;
      border: 1px solid #d7d7dc;
    }

    .button.danger {
      background: white;
      color: #d70015;
      border: 1px solid #d7d7dc;
    }

    .small-button {
      border: none;
      background: #eef5ff;
      color: #007aff;
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
    }

    .delete-button {
      border: none;
      background: #fff0f1;
      color: #d70015;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .back {
      border: none;
      background: none;
      color: #007aff;
      font-size: 17px;
      padding: 0;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .option:last-child {
      border-bottom: none;
    }

    .packing-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .packing-item:last-child {
      border-bottom: none;
    }

    .packing-item.checked span {
      color: #999;
      text-decoration: line-through;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .hidden {
      display: none;
    }

    .selected-summary {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eaf3ff;
      color: #245d9c;
      font-size: 14px;
      line-height: 1.5;
    }

    .progress {
      margin-bottom: 18px;
      font-size: 15px;
      color: #666;
    }

    .progress strong {
      color: #222;
      font-size: 18px;
    }

    .trip-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .trip-dates {
      color: #666;
      margin-bottom: 10px;
    }

    .trip-types {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .template-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .template-row:last-child {
      border-bottom: none;
    }

    .template-count {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .editor-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .editor-item:last-child {
      border-bottom: none;
    }

    .editor-item-name {
      font-size: 16px;
      line-height: 1.4;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .add-row input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #d8d8dd;
      border-radius: 10px;
    }

    .add-row button {
      border: none;
      border-radius: 10px;
      background: #007aff;
      color: white;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ホーム -->
    <section id="home">

      <h1>旅行持ち物メモ</h1>

      <div class="subtitle">
        旅行パターンを組み合わせて、
        自分用の持ち物リストを作ります。
      </div>

      <div id="homeStatus" class="card">
        <h2>次の旅行</h2>
        <p>まだ旅行は登録されていません。</p>
      </div>

      <button
        class="button"
        onclick="showCreateTrip()"
      >
        ＋ 新しい旅行を作る
      </button>

      <button
        id="continueButton"
        class="button secondary hidden"
        onclick="openSavedPackingList()"
      >
        保存中のチェックリストを開く
      </button>

      <button
        class="button secondary"
        onclick="showTemplateList()"
      >
        テンプレートを編集
      </button>

    </section>


    <!-- 新しい旅行 -->
    <section id="createTrip" class="hidden">

      <button
        class="back"
        onclick="showHome()"
      >
        ← 戻る
      </button>

      <h1>新しい旅行</h1>

      <div class="subtitle">
        旅行情報と、当てはまる旅行パターンを選んでください。
      </div>

      <div class="card">

        <div class="field">
          <label for="tripName">旅行名</label>
          <input
            id="tripName"
            type="text"
            placeholder="例：台湾 4泊5日"
          >
        </div>

        <div class="field">
          <label for="startDate">出発日</label>
          <input
            id="startDate"
            type="date"
          >
        </div>

        <div class="field">
          <label for="endDate">帰宅日</label>
          <input
            id="endDate"
            type="date"
          >
        </div>

      </div>

      <div class="card">

        <label class="option">
          <input type="checkbox" class="trip-type" value="basic">
          <span>基本</span>
        </label>

        <label class="option">
          <input type="checkbox" class="trip-type" value="domestic">
          <span>国内旅行</span>
        </label>

        <label class="option">
          <input type="checkbox" class="trip-type" value="overseas">
          <span>海外旅行</span>
        </label>

        <label class="option">
          <input type="checkbox" class="trip-type" value="children">
          <span>子連れ</span>
        </label>

        <label class="option">
          <input type="checkbox" class="trip-type" value="summer">
          <span>夏</span>
        </label>

        <label class="option">
          <input type="checkbox" class="trip-type" value="winter">
          <span>冬</span>
        </label>

        <label class="option">
          <input type="checkbox" class="trip-type" value="onsen">
          <span>温泉</span>
        </label>

        <label class="option">
          <input type="checkbox" class="trip-type" value="pool">
          <span>海・プール</span>
        </label>

      </div>

      <button
        class="button"
        onclick="createPackingList()"
      >
        チェックリストを作る
      </button>

    </section>


    <!-- 持ち物リスト -->
    <section id="packingList" class="hidden">

      <button
        class="back"
        onclick="showCreateTrip(true)"
      >
        ← 旅行情報に戻る
      </button>

      <h1 id="packingTripName">持ち物リスト</h1>

      <div
        id="packingTripDates"
        class="subtitle"
      ></div>

      <div
        id="selectedSummary"
        class="selected-summary"
      ></div>

      <div
        id="progress"
        class="progress"
      ></div>

      <div id="packingItems"></div>

      <button
        class="button secondary"
        onclick="clearAllChecks()"
      >
        チェックを全部外す
      </button>

      <button
        class="button secondary"
        onclick="showHome()"
      >
        ホームに戻る
      </button>

      <button
        class="button danger"
        onclick="deleteSavedTrip()"
      >
        この旅行を削除する
      </button>

    </section>


    <!-- テンプレート一覧 -->
    <section id="templateList" class="hidden">

      <button
        class="back"
        onclick="showHome()"
      >
        ← 戻る
      </button>

      <h1>テンプレート編集</h1>

      <div class="subtitle">
        各旅行パターンの持ち物を自分用に変更できます。
      </div>

      <div id="templateListContainer" class="card"></div>

      <button
        class="button danger"
        onclick="resetTemplates()"
      >
        テンプレートを初期状態に戻す
      </button>

    </section>


    <!-- 個別テンプレート編集 -->
    <section id="templateEditor" class="hidden">

      <button
        class="back"
        onclick="showTemplateList()"
      >
        ← テンプレート一覧
      </button>

      <h1 id="templateEditorTitle">テンプレート編集</h1>

      <div class="subtitle">
        項目の追加・削除ができます。
      </div>

      <div class="card">
        <div id="templateItems"></div>

        <div class="add-row">
          <input
            id="newTemplateItem"
            type="text"
            placeholder="持ち物を追加"
          >
          <button onclick="addTemplateItem()">
            追加
          </button>
        </div>
      </div>

    </section>

  </div>


  <script>

    const TRIP_STORAGE_KEY = "travelPackingData";
    const TEMPLATE_STORAGE_KEY = "travelPackingTemplates";


    const defaultTemplates = {

      basic: {
        title: "基本",
        items: [
          "財布",
          "iPhone",
          "充電ケーブル",
          "モバイルバッテリー",
          "下着",
          "靴下",
          "歯ブラシ",
          "常備薬"
        ]
      },

      domestic: {
        title: "国内旅行",
        items: [
          "健康保険証",
          "交通系ICカード"
        ]
      },

      overseas: {
        title: "海外旅行",
        items: [
          "パスポート",
          "クレジットカード",
          "海外旅行保険",
          "eSIM",
          "変換プラグ"
        ]
      },

      children: {
        title: "子連れ",
        items: [
          "子どもの着替え",
          "子どもの保険証",
          "お菓子",
          "おもちゃ",
          "ウェットティッシュ"
        ]
      },

      summer: {
        title: "夏",
        items: [
          "帽子",
          "日焼け止め",
          "サングラス"
        ]
      },

      winter: {
        title: "冬",
        items: [
          "防寒着",
          "手袋",
          "マフラー"
        ]
      },

      onsen: {
        title: "温泉",
        items: [
          "スキンケア用品",
          "替えの下着"
        ]
      },

      pool: {
        title: "海・プール",
        items: [
          "水着",
          "ゴーグル",
          "タオル",
          "防水バッグ"
        ]
      }

    };


    let currentTemplateKey = null;


    function cloneDefaultTemplates() {
      return JSON.parse(
        JSON.stringify(defaultTemplates)
      );
    }


    function getTemplates() {
      const saved =
        localStorage.getItem(
          TEMPLATE_STORAGE_KEY
        );

      if (!saved) {
        return cloneDefaultTemplates();
      }

      try {
        return JSON.parse(saved);
      } catch {
        return cloneDefaultTemplates();
      }
    }


    function saveTemplates(templates) {
      localStorage.setItem(
        TEMPLATE_STORAGE_KEY,
        JSON.stringify(templates)
      );
    }


    function getSavedData() {
      const saved =
        localStorage.getItem(
          TRIP_STORAGE_KEY
        );

      if (!saved) {
        return null;
      }

      try {
        return JSON.parse(saved);
      } catch {
        return null;
      }
    }


    function saveData(data) {
      localStorage.setItem(
        TRIP_STORAGE_KEY,
        JSON.stringify(data)
      );

      updateHomeStatus();
    }


    function hideAllScreens() {
      [
        "home",
        "createTrip",
        "packingList",
        "templateList",
        "templateEditor"
      ].forEach(function(id) {
        document
          .getElementById(id)
          .classList.add("hidden");
      });
    }


    function showHome() {
      hideAllScreens();
      updateHomeStatus();

      document
        .getElementById("home")
        .classList.remove("hidden");
    }


    function showCreateTrip(
      keepCurrentSelection = false
    ) {
      hideAllScreens();

      if (keepCurrentSelection) {
        const saved = getSavedData();

        if (saved) {
          document.getElementById("tripName").value =
            saved.tripName || "";

          document.getElementById("startDate").value =
            saved.startDate || "";

          document.getElementById("endDate").value =
            saved.endDate || "";

          document
            .querySelectorAll(".trip-type")
            .forEach(function(box) {
              box.checked =
                saved.selectedTypes.includes(
                  box.value
                );
            });
        }
      }

      document
        .getElementById("createTrip")
        .classList.remove("hidden");
    }


    function createPackingList() {

      const templates = getTemplates();

      const tripName =
        document
          .getElementById("tripName")
          .value
          .trim();

      const startDate =
        document
          .getElementById("startDate")
          .value;

      const endDate =
        document
          .getElementById("endDate")
          .value;

      const selected =
        Array.from(
          document.querySelectorAll(
            ".trip-type:checked"
          )
        );


      if (!tripName) {
        alert("旅行名を入力してください");
        return;
      }


      if (selected.length === 0) {
        alert(
          "旅行パターンを1つ以上選んでください"
        );
        return;
      }


      if (
        startDate &&
        endDate &&
        endDate < startDate
      ) {
        alert(
          "帰宅日は出発日以降にしてください"
        );
        return;
      }


      const selectedTypes =
        selected.map(function(option) {
          return option.value;
        });


      const previous =
        getSavedData();

      let checkedItems = [];

      if (previous) {
        checkedItems =
          previous.checkedItems || [];
      }


      const data = {
        tripName: tripName,
        startDate: startDate,
        endDate: endDate,
        selectedTypes: selectedTypes,
        checkedItems: checkedItems
      };


      saveData(data);

      renderPackingList(data);
    }


    function renderPackingList(data) {

      const templates = getTemplates();

      const packingItems =
        document.getElementById(
          "packingItems"
        );

      packingItems.innerHTML = "";

      const selectedNames = [];
      const alreadyAdded = new Set();


      data.selectedTypes.forEach(
        function(type) {

          const template =
            templates[type];

          if (!template) {
            return;
          }

          selectedNames.push(
            template.title
          );


          const card =
            document.createElement(
              "div"
            );

          card.className = "card";


          const heading =
            document.createElement(
              "h2"
            );

          heading.textContent =
            template.title;

          card.appendChild(heading);


          let addedCount = 0;


          template.items.forEach(
            function(item) {

              if (
                alreadyAdded.has(item)
              ) {
                return;
              }

              alreadyAdded.add(item);
              addedCount++;


              const label =
                document.createElement(
                  "label"
                );

              label.className =
                "packing-item";


              const checkbox =
                document.createElement(
                  "input"
                );

              checkbox.type =
                "checkbox";

              checkbox.checked =
                data.checkedItems
                  .includes(item);


              if (
                checkbox.checked
              ) {
                label.classList.add(
                  "checked"
                );
              }


              checkbox.addEventListener(
                "change",
                function() {

                  toggleItem(
                    item,
                    checkbox.checked
                  );

                  if (
                    checkbox.checked
                  ) {
                    label.classList.add(
                      "checked"
                    );
                  } else {
                    label.classList.remove(
                      "checked"
                    );
                  }

                  updateProgress();

                }
              );


              const text =
                document.createElement(
                  "span"
                );

              text.textContent =
                item;


              label.appendChild(
                checkbox
              );

              label.appendChild(
                text
              );

              card.appendChild(
                label
              );

            }
          );


          if (
            addedCount > 0
          ) {
            packingItems
              .appendChild(card);
          }

        }
      );


      document
        .getElementById(
          "packingTripName"
        )
        .textContent =
        data.tripName ||
        "持ち物リスト";


      document
        .getElementById(
          "packingTripDates"
        )
        .textContent =
        formatDateRange(
          data.startDate,
          data.endDate
        );


      document
        .getElementById(
          "selectedSummary"
        )
        .textContent =
        "選択中："
        + selectedNames.join(" ＋ ");


      hideAllScreens();

      document
        .getElementById(
          "packingList"
        )
        .classList.remove(
          "hidden"
        );


      updateProgress();
    }


    function toggleItem(
      item,
      checked
    ) {

      const data =
        getSavedData();

      if (!data) {
        return;
      }

      const set =
        new Set(
          data.checkedItems || []
        );


      if (checked) {
        set.add(item);
      } else {
        set.delete(item);
      }


      data.checkedItems =
        Array.from(set);

      saveData(data);
    }


    function updateProgress() {

      const checkboxes =
        document.querySelectorAll(
          "#packingItems input[type='checkbox']"
        );

      const total =
        checkboxes.length;

      const checked =
        Array.from(checkboxes)
          .filter(function(box) {
            return box.checked;
          })
          .length;


      document
        .getElementById("progress")
        .innerHTML =
        "<strong>"
        + checked
        + " / "
        + total
        + "</strong> 準備済み";
    }


    function clearAllChecks() {

      const data =
        getSavedData();

      if (!data) {
        return;
      }

      data.checkedItems = [];

      saveData(data);

      renderPackingList(data);
    }


    function deleteSavedTrip() {

      const ok =
        confirm(
          "保存中の旅行を削除しますか？"
        );

      if (!ok) {
        return;
      }

      localStorage.removeItem(
        TRIP_STORAGE_KEY
      );

      document
        .getElementById(
          "tripName"
        )
        .value = "";

      document
        .getElementById(
          "startDate"
        )
        .value = "";

      document
        .getElementById(
          "endDate"
        )
        .value = "";

      document
        .querySelectorAll(
          ".trip-type"
        )
        .forEach(function(box) {
          box.checked = false;
        });

      showHome();
    }


    function openSavedPackingList() {

      const data =
        getSavedData();

      if (!data) {
        return;
      }

      renderPackingList(data);
    }


    function updateHomeStatus() {

      const templates =
        getTemplates();

      const data =
        getSavedData();

      const status =
        document.getElementById(
          "homeStatus"
        );

      const continueButton =
        document.getElementById(
          "continueButton"
        );


      if (!data) {

        status.innerHTML =
          "<h2>次の旅行</h2>"
          + "<p>"
          + "まだ旅行は登録されていません。"
          + "</p>";

        continueButton
          .classList.add("hidden");

        return;
      }


      const names =
        data.selectedTypes
          .map(function(type) {
            return templates[type]?.title;
          })
          .filter(Boolean);


      const dateText =
        formatDateRange(
          data.startDate,
          data.endDate
        );


      status.innerHTML =
        "<h2>保存中の旅行</h2>"
        + "<div class='trip-name'>"
        + escapeHtml(
          data.tripName || "旅行"
        )
        + "</div>"
        + (
          dateText
            ? "<div class='trip-dates'>"
              + escapeHtml(dateText)
              + "</div>"
            : ""
        )
        + "<div class='trip-types'>"
        + escapeHtml(
          names.join(" ＋ ")
        )
        + "</div>";


      continueButton
        .classList.remove("hidden");
    }


    function showTemplateList() {

      hideAllScreens();

      renderTemplateList();

      document
        .getElementById(
          "templateList"
        )
        .classList.remove("hidden");
    }


    function renderTemplateList() {

      const templates =
        getTemplates();

      const container =
        document.getElementById(
          "templateListContainer"
        );

      container.innerHTML = "";


      Object.keys(templates)
        .forEach(function(key) {

          const template =
            templates[key];


          const row =
            document.createElement(
              "div"
            );

          row.className =
            "template-row";


          const info =
            document.createElement(
              "div"
            );


          const title =
            document.createElement(
              "h3"
            );

          title.textContent =
            template.title;


          const count =
            document.createElement(
              "div"
            );

          count.className =
            "template-count";

          count.textContent =
            template.items.length
            + "項目";


          info.appendChild(title);
          info.appendChild(count);


          const button =
            document.createElement(
              "button"
            );

          button.className =
            "small-button";

          button.textContent =
            "編集";

          button.onclick =
            function() {
              openTemplateEditor(key);
            };


          row.appendChild(info);
          row.appendChild(button);

          container.appendChild(row);

        });
    }


    function openTemplateEditor(key) {

      const templates =
        getTemplates();

      currentTemplateKey = key;

      const template =
        templates[key];

      if (!template) {
        return;
      }


      document
        .getElementById(
          "templateEditorTitle"
        )
        .textContent =
        template.title;


      renderTemplateItems();

      document
        .getElementById(
          "newTemplateItem"
        )
        .value = "";


      hideAllScreens();

      document
        .getElementById(
          "templateEditor"
        )
        .classList.remove("hidden");
    }


    function renderTemplateItems() {

      const templates =
        getTemplates();

      const template =
        templates[
          currentTemplateKey
        ];

      const container =
        document.getElementById(
          "templateItems"
        );

      container.innerHTML = "";


      if (!template) {
        return;
      }


      template.items.forEach(
        function(item, index) {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "editor-item";


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "editor-item-name";

          name.textContent =
            item;


          const button =
            document.createElement(
              "button"
            );

          button.className =
            "delete-button";

          button.textContent =
            "削除";

          button.onclick =
            function() {
              deleteTemplateItem(
                index
              );
            };


          row.appendChild(name);
          row.appendChild(button);

          container.appendChild(row);

        });
    }


    function addTemplateItem() {

      const input =
        document.getElementById(
          "newTemplateItem"
        );

      const value =
        input.value.trim();

      if (!value) {
        return;
      }


      const templates =
        getTemplates();

      const template =
        templates[
          currentTemplateKey
        ];

      if (!template) {
        return;
      }


      if (
        template.items.includes(value)
      ) {
        alert(
          "同じ項目がすでにあります"
        );
        return;
      }


      template.items.push(value);

      saveTemplates(templates);

      input.value = "";

      renderTemplateItems();
    }


    function deleteTemplateItem(
      index
    ) {

      const templates =
        getTemplates();

      const template =
        templates[
          currentTemplateKey
        ];

      if (!template) {
        return;
      }


      template.items.splice(
        index,
        1
      );

      saveTemplates(templates);

      renderTemplateItems();
    }


    function resetTemplates() {

      const ok =
        confirm(
          "すべてのテンプレートを初期状態に戻しますか？"
        );

      if (!ok) {
        return;
      }


      localStorage.removeItem(
        TEMPLATE_STORAGE_KEY
      );

      renderTemplateList();

      alert(
        "テンプレートを初期状態に戻しました"
      );
    }


    function formatDateRange(
      startDate,
      endDate
    ) {

      if (!startDate && !endDate) {
        return "";
      }

      if (
        startDate &&
        !endDate
      ) {
        return formatDate(startDate);
      }

      if (
        !startDate &&
        endDate
      ) {
        return formatDate(endDate);
      }

      return (
        formatDate(startDate)
        + " 〜 "
        + formatDate(endDate)
      );
    }


    function formatDate(
      dateString
    ) {

      if (!dateString) {
        return "";
      }

      const parts =
        dateString.split("-");

      if (
        parts.length !== 3
      ) {
        return dateString;
      }

      const year =
        parts[0];

      const month =
        Number(parts[1]);

      const day =
        Number(parts[2]);


      return (
        year
        + "年"
        + month
        + "月"
        + day
        + "日"
      );
    }


    function escapeHtml(text) {

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function initializeApp() {

      const saved =
        getSavedData();

      updateHomeStatus();


      if (saved) {

        document
          .getElementById(
            "tripName"
          )
          .value =
          saved.tripName || "";

        document
          .getElementById(
            "startDate"
          )
          .value =
          saved.startDate || "";

        document
          .getElementById(
            "endDate"
          )
          .value =
          saved.endDate || "";


        document
          .querySelectorAll(
            ".trip-type"
          )
          .forEach(
            function(box) {

              box.checked =
                saved.selectedTypes
                  .includes(
                    box.value
                  );

            }
          );
      }
    }


    initializeApp();

  </script>

</body>
</html>
