<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>旅行持ち物メモ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    .button.secondary {
      background: white;
      color: #007aff;
      border: 1px solid #d7d7dc;
    }

    .button.danger {
      background: white;
      color: #d70015;
      border: 1px solid #d7d7dc;
    }

    .button:active {
      opacity: 0.8;
    }

    .back {
      border: none;
      background: none;
      color: #007aff;
      font-size: 17px;
      padding: 0;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .option:last-child {
      border-bottom: none;
    }

    .packing-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .packing-item:last-child {
      border-bottom: none;
    }

    .packing-item.checked span {
      color: #999;
      text-decoration: line-through;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .hidden {
      display: none;
    }

    .selected-summary {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eaf3ff;
      color: #245d9c;
      font-size: 14px;
      line-height: 1.5;
    }

    .progress {
      margin-bottom: 18px;
      font-size: 15px;
      color: #666;
    }

    .progress strong {
      color: #222;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ホーム -->
    <section id="home">

      <h1>旅行持ち物メモ</h1>

      <div class="subtitle">
        旅行パターンを組み合わせて、
        自分用の持ち物リストを作ります。
      </div>

      <div id="homeStatus" class="card">
        <h2>次の旅行</h2>
        <p>まだ旅行は登録されていません。</p>
      </div>

      <button
        class="button"
        onclick="showCreateTrip()"
      >
        ＋ 新しい旅行を作る
      </button>

      <button
        id="continueButton"
        class="button secondary hidden"
        onclick="openSavedPackingList()"
      >
        保存中のチェックリストを開く
      </button>

    </section>


    <!-- パターン選択 -->
    <section id="createTrip" class="hidden">

      <button
        class="back"
        onclick="showHome()"
      >
        ← 戻る
      </button>

      <h1>新しい旅行</h1>

      <div class="subtitle">
        当てはまる旅行パターンを複数選べます。
      </div>

      <div class="card">

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="basic"
          >
          <span>基本</span>
        </label>

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="domestic"
          >
          <span>国内旅行</span>
        </label>

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="overseas"
          >
          <span>海外旅行</span>
        </label>

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="children"
          >
          <span>子連れ</span>
        </label>

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="summer"
          >
          <span>夏</span>
        </label>

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="winter"
          >
          <span>冬</span>
        </label>

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="onsen"
          >
          <span>温泉</span>
        </label>

        <label class="option">
          <input
            type="checkbox"
            class="trip-type"
            value="pool"
          >
          <span>海・プール</span>
        </label>

      </div>

      <button
        class="button"
        onclick="createPackingList()"
      >
        チェックリストを作る
      </button>

    </section>


    <!-- 持ち物リスト -->
    <section id="packingList" class="hidden">

      <button
        class="back"
        onclick="showCreateTrip(true)"
      >
        ← パターン選択に戻る
      </button>

      <h1>持ち物リスト</h1>

      <div
        id="selectedSummary"
        class="selected-summary"
      ></div>

      <div
        id="progress"
        class="progress"
      ></div>

      <div id="packingItems"></div>

      <button
        class="button secondary"
        onclick="clearAllChecks()"
      >
        チェックを全部外す
      </button>

      <button
        class="button danger"
        onclick="deleteSavedTrip()"
      >
        この旅行を削除する
      </button>

    </section>

  </div>


  <script>

    const STORAGE_KEY =
      "travelPackingData";

    const templates = {

      basic: {
        title: "基本",
        items: [
          "財布",
          "iPhone",
          "充電ケーブル",
          "モバイルバッテリー",
          "下着",
          "靴下",
          "歯ブラシ",
          "常備薬"
        ]
      },

      domestic: {
        title: "国内旅行",
        items: [
          "健康保険証",
          "交通系ICカード"
        ]
      },

      overseas: {
        title: "海外旅行",
        items: [
          "パスポート",
          "クレジットカード",
          "海外旅行保険",
          "eSIM",
          "変換プラグ"
        ]
      },

      children: {
        title: "子連れ",
        items: [
          "子どもの着替え",
          "子どもの保険証",
          "お菓子",
          "おもちゃ",
          "ウェットティッシュ"
        ]
      },

      summer: {
        title: "夏",
        items: [
          "帽子",
          "日焼け止め",
          "サングラス"
        ]
      },

      winter: {
        title: "冬",
        items: [
          "防寒着",
          "手袋",
          "マフラー"
        ]
      },

      onsen: {
        title: "温泉",
        items: [
          "スキンケア用品",
          "替えの下着"
        ]
      },

      pool: {
        title: "海・プール",
        items: [
          "水着",
          "ゴーグル",
          "タオル",
          "防水バッグ"
        ]
      }

    };


    function getSavedData() {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (!saved) {
        return null;
      }

      try {
        return JSON.parse(saved);
      } catch {
        return null;
      }

    }


    function saveData(data) {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

      updateHomeStatus();

    }


    function hideAllScreens() {

      document
        .getElementById("home")
        .classList.add("hidden");

      document
        .getElementById("createTrip")
        .classList.add("hidden");

      document
        .getElementById("packingList")
        .classList.add("hidden");

    }


    function showHome() {

      hideAllScreens();

      updateHomeStatus();

      document
        .getElementById("home")
        .classList.remove("hidden");

    }


    function showCreateTrip(
      keepCurrentSelection = false
    ) {

      hideAllScreens();

      if (keepCurrentSelection) {

        const saved =
          getSavedData();

        if (saved) {

          document
            .querySelectorAll(
              ".trip-type"
            )
            .forEach(function(box) {

              box.checked =
                saved.selectedTypes
                  .includes(
                    box.value
                  );

            });

        }

      }

      document
        .getElementById(
          "createTrip"
        )
        .classList.remove(
          "hidden"
        );

    }


    function createPackingList() {

      const selected =
        Array.from(
          document.querySelectorAll(
            ".trip-type:checked"
          )
        );

      if (
        selected.length === 0
      ) {

        alert(
          "旅行パターンを1つ以上選んでください"
        );

        return;

      }

      const selectedTypes =
        selected.map(
          function(option) {
            return option.value;
          }
        );


      const previous =
        getSavedData();


      let checkedItems = [];

      if (previous) {
        checkedItems =
          previous.checkedItems || [];
      }


      const data = {
        selectedTypes:
          selectedTypes,

        checkedItems:
          checkedItems
      };


      saveData(data);

      renderPackingList(data);

    }


    function renderPackingList(
      data
    ) {

      const packingItems =
        document.getElementById(
          "packingItems"
        );

      packingItems.innerHTML = "";

      const selectedNames = [];

      const alreadyAdded =
        new Set();


      data.selectedTypes.forEach(
        function(type) {

          const template =
            templates[type];

          if (!template) {
            return;
          }

          selectedNames.push(
            template.title
          );


          const card =
            document.createElement(
              "div"
            );

          card.className = "card";


          const heading =
            document.createElement(
              "h2"
            );

          heading.textContent =
            template.title;

          card.appendChild(
            heading
          );


          let addedCount = 0;


          template.items.forEach(
            function(item) {

              if (
                alreadyAdded.has(item)
              ) {
                return;
              }

              alreadyAdded.add(item);

              addedCount++;


              const label =
                document.createElement(
                  "label"
                );

              label.className =
                "packing-item";


              const checkbox =
                document.createElement(
                  "input"
                );

              checkbox.type =
                "checkbox";

              checkbox.checked =
                data.checkedItems
                  .includes(item);


              if (
                checkbox.checked
              ) {
                label.classList.add(
                  "checked"
                );
              }


              checkbox.addEventListener(
                "change",
                function() {

                  toggleItem(
                    item,
                    checkbox.checked
                  );

                  if (
                    checkbox.checked
                  ) {
                    label.classList.add(
                      "checked"
                    );
                  } else {
                    label.classList.remove(
                      "checked"
                    );
                  }

                  updateProgress();

                }
              );


              const text =
                document.createElement(
                  "span"
                );

              text.textContent =
                item;


              label.appendChild(
                checkbox
              );

              label.appendChild(
                text
              );

              card.appendChild(
                label
              );

            }
          );


          if (
            addedCount > 0
          ) {
            packingItems
              .appendChild(
                card
              );
          }

        }
      );


      document
        .getElementById(
          "selectedSummary"
        )
        .textContent =
        "選択中："
        + selectedNames.join(
          " ＋ "
        );


      hideAllScreens();

      document
        .getElementById(
          "packingList"
        )
        .classList.remove(
          "hidden"
        );


      updateProgress();

    }


    function toggleItem(
      item,
      checked
    ) {

      const data =
        getSavedData();

      if (!data) {
        return;
      }

      const set =
        new Set(
          data.checkedItems || []
        );


      if (checked) {

        set.add(item);

      } else {

        set.delete(item);

      }


      data.checkedItems =
        Array.from(set);

      saveData(data);

    }


    function updateProgress() {

      const checkboxes =
        document.querySelectorAll(
          "#packingItems input[type='checkbox']"
        );

      const total =
        checkboxes.length;

      const checked =
        Array.from(
          checkboxes
        ).filter(
          function(box) {
            return box.checked;
          }
        ).length;


      document
        .getElementById(
          "progress"
        )
        .innerHTML =
        "<strong>"
        + checked
        + " / "
        + total
        + "</strong> 準備済み";

    }


    function clearAllChecks() {

      const data =
        getSavedData();

      if (!data) {
        return;
      }

      data.checkedItems = [];

      saveData(data);

      renderPackingList(data);

    }


    function deleteSavedTrip() {

      const ok =
        confirm(
          "保存中の旅行を削除しますか？"
        );

      if (!ok) {
        return;
      }

      localStorage.removeItem(
        STORAGE_KEY
      );

      document
        .querySelectorAll(
          ".trip-type"
        )
        .forEach(
          function(box) {
            box.checked = false;
          }
        );

      showHome();

    }


    function openSavedPackingList() {

      const data =
        getSavedData();

      if (!data) {
        return;
      }

      renderPackingList(data);

    }


    function updateHomeStatus() {

      const data =
        getSavedData();

      const status =
        document.getElementById(
          "homeStatus"
        );

      const continueButton =
        document.getElementById(
          "continueButton"
        );


      if (!data) {

        status.innerHTML =
          "<h2>次の旅行</h2>"
          + "<p>"
          + "まだ旅行は登録されていません。"
          + "</p>";

        continueButton
          .classList.add(
            "hidden"
          );

        return;

      }


      const names =
        data.selectedTypes
          .map(
            function(type) {
              return templates[type]
                ?.title;
            }
          )
          .filter(Boolean);


      status.innerHTML =
        "<h2>保存中の旅行</h2>"
        + "<p>"
        + names.join(" ＋ ")
        + "</p>";


      continueButton
        .classList.remove(
          "hidden"
        );

    }


    function initializeApp() {

      const saved =
        getSavedData();

      updateHomeStatus();


      if (saved) {

        document
          .querySelectorAll(
            ".trip-type"
          )
          .forEach(
            function(box) {

              box.checked =
                saved.selectedTypes
                  .includes(
                    box.value
                  );

            }
          );

      }

    }


    initializeApp();

  </script>

</body>
</html>
