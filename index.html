<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行持ち物メモ</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .option:last-child {
      border-bottom: none;
    }

    .hidden {
      display: none;
    }

    .back {
      border: none;
      background: none;
      color: #007aff;
      font-size: 17px;
      padding: 0;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div id="home">
      <h1>旅行持ち物メモ</h1>

      <div class="subtitle">
        旅行パターンを組み合わせて、持ち物リストを作ります
      </div>

      <div class="card">
        <h2>次の旅行</h2>
        <p>まだ旅行は登録されていません。</p>
      </div>

      <button class="button" onclick="showCreateTrip()">
        ＋ 新しい旅行を作る
      </button>
    </div>

    <div id="createTrip" class="hidden">
      <button class="back" onclick="showHome()">
        ← 戻る
      </button>

      <h1>新しい旅行</h1>

      <div class="subtitle">
        当てはまる旅行パターンを選んでください
      </div>

      <div class="card">

        <label class="option">
          <input type="checkbox">
          基本
        </label>

        <label class="option">
          <input type="checkbox">
          国内旅行
        </label>

        <label class="option">
          <input type="checkbox">
          海外旅行
        </label>

        <label class="option">
          <input type="checkbox">
          子連れ
        </label>

        <label class="option">
          <input type="checkbox">
          夏
        </label>

        <label class="option">
          <input type="checkbox">
          冬
        </label>

        <label class="option">
          <input type="checkbox">
          温泉
        </label>

        <label class="option">
          <input type="checkbox">
          海・プール
        </label>

      </div>

      <button class="button">
        チェックリストを作る
      </button>
    </div>

  </div>

  <script>
    function showCreateTrip() {
      document.getElementById("home").classList.add("hidden");
      document.getElementById("createTrip").classList.remove("hidden");
    }

    function showHome() {
      document.getElementById("createTrip").classList.add("hidden");
      document.getElementById("home").classList.remove("hidden");
    }
  </script>

</body>
</html>
